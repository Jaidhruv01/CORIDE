version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coride_postgres
    restart: always
    environment:
      POSTGRES_USER: coride_user
      POSTGRES_PASSWORD: coride_secure_password
      POSTGRES_DB: coride_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coride_user -d coride_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coride_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coride_backend
    restart: always
    environment:
      - APP_ENV=production
      - SECRET_KEY=coride-super-secret-production-grade-key-lavender-2026
      - DATABASE_URL=postgresql://coride_user:coride_secure_password@postgres:5432/coride_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coride_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
